[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytviews"
version = "2.0.0"
description = "Predict YouTube view counts (with uncertainty) from title, description, channel and timing signals."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Morgan White" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "joblib>=1.3",
    "typer>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.100"]
text = ["sentence-transformers>=2.2"]
gbm = ["lightgbm>=4.0"]
plots = ["matplotlib>=3.7"]
app = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "ruff>=0.4"]
all = ["ytviews[youtube,text,gbm,plots,app]"]

[project.scripts]
ytviews = "ytviews.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
