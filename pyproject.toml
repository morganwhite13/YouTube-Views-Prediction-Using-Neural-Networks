[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytviews"
dynamic = ["version"]
description = "Predict YouTube view counts (with uncertainty) from title, description, channel and timing signals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Morgan White" }]
requires-python = ">=3.10"
keywords = ["youtube", "views", "prediction", "neural-network", "pytorch", "creator-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "joblib>=1.3",
    "typer>=0.9",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.100"]
text = ["sentence-transformers>=2.2"]
gbm = ["lightgbm>=4.0"]
plots = ["matplotlib>=3.7"]
app = ["streamlit>=1.43"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
llm = ["anthropic>=1.0"]
faces = ["opencv-python-headless>=4.8,<5"]
onnx = ["onnxruntime>=1.17"]  # serve an exported model without PyTorch
onnx-export = ["onnx>=1.16", "onnxscript>=0.1", "onnxruntime>=1.17"]  # OpenCV 5 dropped the bundled face detector
dev = ["pytest>=7.4", "ruff>=0.4", "hypothesis>=6.100"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
all = ["ytviews[youtube,text,gbm,plots,app,api,llm,faces]"]

[project.urls]
Homepage = "https://github.com/morganwhite13/YouTube-Views-Prediction-Using-Neural-Networks"
Changelog = "https://github.com/morganwhite13/YouTube-Views-Prediction-Using-Neural-Networks/blob/main/CHANGELOG.md"
Issues = "https://github.com/morganwhite13/YouTube-Views-Prediction-Using-Neural-Networks/issues"

[project.scripts]
ytviews = "ytviews.cli:app"

[tool.setuptools.dynamic]
version = { attr = "ytviews.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
