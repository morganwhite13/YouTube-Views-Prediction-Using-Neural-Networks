# Keeps the dataset growing without anyone remembering to run it.
#
# Twice a week it refreshes the stats of every stored video (this adds the repeat snapshots that
# `ytviews track` is calibrated on) and, on the first run, collects the seed channels. The SQLite
# database lives on a separate `ytviews-data` branch so the main branch stays code-only.
#
# Setup: Settings -> Secrets and variables -> Actions -> New repository secret
#        name YOUTUBE_API_KEY. Without the secret the workflow does nothing.
name: Collect data

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:
    inputs:
      trending:
        description: "Also sample trending videos (US) and their channels"
        type: boolean
        default: false
      thumbnails:
        description: "Download thumbnails too (adds image files to the data branch)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YTVIEWS_DATA_DIR: data
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY secret is not set; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.key.outputs.present == 'true'
        run: pip install -e ".[youtube]"

      - name: Restore the dataset from the data branch
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p data
          if git fetch --depth=1 origin ytviews-data 2>/dev/null; then
            git --work-tree=data checkout FETCH_HEAD -- .
            git reset -q
          fi
          ls -la data

      - name: Collect
        if: steps.key.outputs.present == 'true'
        run: |
          if [ -f data/ytviews.db ]; then
            ytviews refresh
          else
            ytviews collect --seed-channels
          fi
          if [ "${{ inputs.trending }}" = "true" ]; then
            ytviews collect --trending --region US --videos-per-channel 30
          fi
          if [ "${{ inputs.thumbnails }}" = "true" ]; then
            ytviews thumbnails
          fi
          ytviews stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the dataset to the data branch
        if: steps.key.outputs.present == 'true'
        run: |
          cd data
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ytviews-data
          git add -A
          git commit -q -m "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            ytviews-data
